<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shreehari CD IELTS · Choose Your Test</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #f8faff;
    --bg-2: #e9f0fc;
    --brand: #1e3a5f;
    --heading: #182b4d;
    --accent: #2d5a8e;
    --accent-soft: #eaf1fb;
    --muted: #6b7280;
    --border: #e3eaf6;
    --surface: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { min-height: 100%; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    color: var(--heading);
    min-height: 100vh;
    background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    padding: 40px 24px 56px;
    position: relative;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }
  /* soft decorative glows */
  body::before, body::after {
    content: ''; position: fixed; z-index: 0; pointer-events: none; border-radius: 50%; filter: blur(70px);
  }
  body::before { width: 420px; height: 420px; top: -140px; right: -100px; background: rgba(45,90,142,.13); }
  body::after  { width: 360px; height: 360px; bottom: -140px; left: -100px; background: rgba(13,148,136,.09); }

  .wrap { position: relative; z-index: 1; max-width: 1000px; width: 100%; margin: 0 auto; flex: 1; }

  .brand {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font-size: clamp(26px, 4.6vw, 44px); font-weight: 700; color: var(--brand);
    letter-spacing: -0.5px; line-height: 1.15;
  }
  .brand .mark {
    width: clamp(40px, 6vw, 56px); height: clamp(40px, 6vw, 56px); border-radius: 16px; flex-shrink: 0;
    background: linear-gradient(145deg, #2d5a8e, #1e3a5f); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(30,58,95,.25);
  }
  .brand .mark svg { width: 55%; height: 55%; }

  h1 {
    text-align: center; font-size: clamp(34px, 6.4vw, 64px); font-weight: 700; color: var(--heading);
    letter-spacing: -1.2px; line-height: 1.1; margin-top: clamp(26px, 4.5vw, 48px);
  }
  .sub {
    text-align: center; font-size: clamp(16px, 2vw, 20px); color: var(--muted);
    margin: 14px 0 clamp(32px, 5vw, 52px);
  }

  .grid {
    display: grid; gap: 28px; justify-content: center;
    grid-template-columns: repeat(auto-fit, minmax(230px, 250px));
  }
  .test-card {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 30px 20px 26px; min-height: 200px;
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 26px;
    text-decoration: none; color: var(--accent); text-align: center;
    box-shadow: 0 10px 30px rgba(45,90,142,.08);
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    opacity: 0; transform: translateY(14px); animation: rise .5s ease forwards;
  }
  .test-card:nth-child(1) { animation-delay: .05s; }
  .test-card:nth-child(2) { animation-delay: .12s; }
  .test-card:nth-child(3) { animation-delay: .19s; }
  .test-card:nth-child(4) { animation-delay: .26s; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .test-card:hover {
    transform: translateY(-6px); border-color: var(--accent);
    box-shadow: 0 20px 44px rgba(45,90,142,.18);
  }
  .test-card:active { transform: translateY(-2px) scale(.99); }
  .test-card:focus-visible { outline: 3px solid rgba(45,90,142,.4); outline-offset: 3px; }

  .day { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -2px; }
  .month {
    font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
    background: var(--accent-soft); color: var(--accent); padding: 4px 12px; border-radius: 20px; margin-top: 4px;
  }
  .parts { font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 14px; }
  .go {
    position: absolute; right: 16px; bottom: 16px; width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center;
    transition: background .2s ease, color .2s ease, transform .2s ease;
  }
  .go svg { width: 15px; height: 15px; }
  .test-card:hover .go { background: var(--accent); color: #fff; transform: translateX(3px); }

  .foot {
    position: relative; z-index: 1; text-align: center; font-size: 13px; color: var(--muted);
    margin-top: 48px;
  }
  .foot svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; }

  @media (max-width: 560px) {
    body { padding: 28px 16px 40px; }
    .grid { gap: 16px; grid-template-columns: 1fr 1fr; }
    .test-card { min-height: 160px; padding: 22px 12px 22px; border-radius: 22px; }
    .day { font-size: 44px; }
    .parts { font-size: 12px; }
    .go { display: none; }
  }
  @media (max-width: 360px) { .grid { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) {
    .test-card { animation: none; opacity: 1; transform: none; transition: none; }
  }
</style>
</head>
